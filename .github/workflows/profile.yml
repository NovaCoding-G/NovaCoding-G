name: Refresh profile signals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "assets/source/**"
      - "assets/fonts/**"
      - "requirements.txt"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-signals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Generate visual system
        run: python scripts/make_ascii.py

      - name: Generate public GitHub signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Validate generated profile
        run: python scripts/validate_profile.py

      - name: Commit changed graphics
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets)" ]]; then
            echo "Profile graphics are already current."
            exit 0
          fi
          git add assets/*.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh profile signals"
          git push
